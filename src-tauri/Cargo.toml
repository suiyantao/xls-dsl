[package]
name = "xls-dsl"
version = "0.0.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [ "macos-private-api"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
calamine = {version = "0.32.0", features= ["dates"] }
anyhow = "1.0.100"
actix-rt = "2.11.0"
lazy_static = "1.4.0"
diesel = {version = "2.3.5", features = ["sqlite", "chrono"] }
chrono = {version = "0.4.42", features = ["serde"] }
env = "1.0.1"
diesel_migrations = "2.1.0"
dirs = "6.0.0"
sonyflake = "0.4.0"
uuid = {version = "1.19.0", features = ["v4"] }
md5 = "0.8.0"
deno_core = "=0.311"
base64 = "0.22.0"
reqwest = { version = "0.12.28", features = ["blocking", "multipart", "cookies"] }
urlencoding = "2.1"
tera = "1.20.1"
handlebars = {version="6.3.2", features = ["string_helpers"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.4.2"
tauri-plugin-fs = "2.4.4"
tokio = { version = "1.48.0", features = ["macros", "rt"] }
thiserror = "2.0.17"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }

rsa = "0.9.6"
sha2 = "0.10.8"
rand = "0.8"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]


[profile.release]
opt-level = 'z'          # 优化二进制大小而非速度
strip = true             # 移除调试符号
panic = 'abort'          # 遇到 panic 时终止程序而非展开栈，减少二进制体积
lto = true               # 启用全程序优化（Link Time Optimization）
codegen-units = 1        # 减少代码生成单元，提升优化效果
